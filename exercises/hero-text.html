<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Text</title>
    <meta name="description" content="An above-the-fold hero block with animated text and various background colours.">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    
    <style type="text/tailwindcss">

    header {
@apply min-h-[60vh] md:min-h-[80vh]
    bg-gray-600
    flex flex-col justify-center
    px-8 lg:px-60 py-12
    text-center;
} 


    header h1 {
    @apply text-7xl md:text-8xl
        text-white font-bold
        tracking-tight
        mb-6;
}
      header { 
@apply min-h-[60vh] md:min-h-[80vh]
    bg-linear-to-b from-purple-600 to-purple-900 
    flex flex-col justify-center
    px-8 lg:px-60 py-12
    text-center;
}

        header h2 {
            @apply text-4xl md:text-5xl
            text-white;
        }
  .slide-in-top {
	animation: slide-in-top 1s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
} 
  .slide-in-left {
	animation: slide-in-left 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}
 
@keyframes slide-in-top {
  0% {
    transform: translateY(-1000px);
    opacity: 0;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}


@keyframes slide-in-left {
  0% {
    transform: translateX(-1000px);
    opacity: 0;
  }
  100% {
    transform: translateX(0);
    opacity: 1;
  }
}


   </style>
  //Subhan Ali 78243//

</head>


<body>

    <!-- hero block -->
     <header>
        <h1 class="slide-in-top"> Albert Camus</h1>

        <h2 class="slide-in-left">Creative Web Developer</h2>
    </header>
    <!-- /hero block -->

</body>
</html>
